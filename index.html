<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FunkinHelper — AI for FNF source code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120F1B;
    --panel: #1B1728;
    --panel-alt: #241E36;
    --border: #33294a;
    --text: #F1ECF7;
    --text-dim: #9A8FB5;
    --purple: #C24B99;
    --cyan: #29E0FF;
    --green: #3CDB6F;
    --red: #F9393F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100%;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 0%, rgba(194,75,153,0.14), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(41,224,255,0.10), transparent 40%);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .highway {
    position: relative;
    height: 6px;
    width: 100%;
    background: linear-gradient(90deg, var(--purple), var(--cyan), var(--green), var(--red));
    background-size: 300% 100%;
    animation: scroll-highway 6s linear infinite;
  }

  @keyframes scroll-highway {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 0%; }
  }

  header {
    padding: 36px 24px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .mark {
    display: inline-flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .mark span {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    transform: rotate(45deg);
    opacity: 0.9;
  }

  .mark span:nth-child(1) { background: var(--purple); }
  .mark span:nth-child(2) { background: var(--cyan); }
  .mark span:nth-child(3) { background: var(--green); }
  .mark span:nth-child(4) { background: var(--red); }

  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 8px;
    text-transform: uppercase;
  }

  h1 span { color: var(--cyan); }

  header p {
    color: var(--text-dim);
    margin: 0 auto;
    max-width: 460px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px 140px;
  }

  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 22px;
    padding: 20px 0;
  }

  .empty-title {
    color: var(--text-dim);
    font-size: 14px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 620px;
  }

  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
    text-align: left;
  }

  .chip:hover { border-color: var(--purple); transform: translateY(-1px); }
  .chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .log {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg {
    max-width: 84%;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--purple), #8f3a75);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: rgba(249,57,63,0.1);
    border: 1px solid var(--red);
    color: var(--text);
  }

  .msg pre {
    background: #0D0B14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 10px 0;
  }

  .msg code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .msg :not(pre) > code {
    background: rgba(255,255,255,0.08);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .msg.user .label { color: rgba(255,255,255,0.75); }

  .thinking {
    align-self: flex-start;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 14px 16px;
  }

  .lane {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    transform: rotate(45deg);
    opacity: 0.25;
    animation: pulse-lane 1.1s ease-in-out infinite;
  }

  .lane:nth-child(1) { background: var(--purple); animation-delay: 0s; }
  .lane:nth-child(2) { background: var(--cyan); animation-delay: 0.15s; }
  .lane:nth-child(3) { background: var(--green); animation-delay: 0.3s; }
  .lane:nth-child(4) { background: var(--red); animation-delay: 0.45s; }

  @keyframes pulse-lane {
    0%, 100% { opacity: 0.25; transform: rotate(45deg) scale(1); }
    50% { opacity: 1; transform: rotate(45deg) scale(1.3); }
  }

  .composer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 24px 20px 22px;
  }

  .composer-inner {
    max-width: 780px;
    margin: 0 auto;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 10px 10px 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 160px;
    padding: 10px 0;
  }

  textarea::placeholder { color: var(--text-dim); }

  button.send {
    background: var(--purple);
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button.send:hover:not(:disabled) { background: #a83e83; }
  button.send:active:not(:disabled) { transform: scale(0.93); }
  button.send:disabled { opacity: 0.4; cursor: not-allowed; }
  button.send:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 11.5px;
    max-width: 780px;
    margin: 10px auto 0;
    font-family: 'JetBrains Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    .highway, .lane { animation: none; }
  }
</style>
</head>
<body>

<div class="highway"></div>

<header>
  <div class="mark"><span></span><span></span><span></span><span></span></div>
  <h1>Funkin<span>Helper</span></h1>
  <p>An AI that helps with Friday Night Funkin' source code — engines, mods, HScript, Lua, and everything in between.</p>
</header>

<main>
  <div class="empty" id="empty">
    <div class="empty-title">Ask about an engine fork, paste a broken script, or start from a common one</div>
    <div class="chips" id="chips">
      <button class="chip">How do I add a new note type in Psych Engine?</button>
      <button class="chip">Convert this Lua stage script to HScript</button>
      <button class="chip">Why is my custom character not animating?</button>
      <button class="chip">Help me build a health icon system in HaxeFlixel</button>
      <button class="chip">My mobile build crashes on note spawn — help debug</button>
    </div>
  </div>
  <div class="log" id="log"></div>
</main>

<div class="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="Ask FunkinHelper about your FNF source code..."></textarea>
    <button class="send" id="send" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </div>
  <div class="hint">Haxe · HaxeFlixel · Lime · OpenFL · Psych · V-Slice · Kade · HScript · Lua</div>
</div>

<script>
const SYSTEM_PROMPT = "You are FunkinHelper, an assistant specialized in Friday Night Funkin' source code: the base Haxe/HaxeFlixel/Lime/OpenFL game, and its major engine forks (Psych Engine, V-Slice/Codename Engine, Kade Engine, Forever Engine, and mobile ports of these). You understand HScript and Lua modding APIs used across these engines, JSON chart formats, native extensions, and Android/iOS build toolchains (Gradle, hxcpp, CI via GitHub Actions). Give direct, technically precise help: fix bugs, explain engine internals, write new features, or convert scripts between Lua and HScript. All code you write must be in English, contain no comments, and must never use trace() calls. Keep prose explanations concise and focused on the fix or the concept, not padding.";

const log = document.getElementById('log');
const empty = document.getElementById('empty');
const chips = document.getElementById('chips');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let messages = [];
let busy = false;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderContent(text) {
  const parts = text.split(/```(\w*)\n?([\s\S]*?)```/g);
  let html = '';
  for (let i = 0; i < parts.length; i += 3) {
    const plain = parts[i] || '';
    html += escapeHtml(plain).replace(/`([^`]+)`/g, '<code>$1</code>');
    const lang = parts[i + 1];
    const code = parts[i + 2];
    if (code !== undefined) {
      html += '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
    }
  }
  return html;
}

function addMessage(role, text) {
  empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = role === 'user' ? 'You' : role === 'error' ? 'Error' : 'FunkinHelper';
  div.appendChild(label);
  const body = document.createElement('div');
  body.innerHTML = renderContent(text);
  div.appendChild(body);
  log.appendChild(div);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  return div;
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking';
  div.innerHTML = '<div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>';
  log.appendChild(div);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function removeThinking() {
  const el = document.getElementById('thinking');
  if (el) el.remove();
}

async function sendMessage(text) {
  if (!text.trim() || busy) return;
  busy = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';
  addThinking();

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await response.json();
    removeThinking();

    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const reply = textBlocks.join('\n').trim();

    if (!reply) {
      addMessage('error', 'No response came back. Try rephrasing your question.');
    } else {
      addMessage('ai', reply);
      messages.push({ role: 'assistant', content: reply });
    }
  } catch (err) {
    removeThinking();
    addMessage('error', 'Something went wrong reaching FunkinHelper. Try again in a moment.');
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', () => sendMessage(input.value));

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(input.value);
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

chips.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) sendMessage(chip.textContent);
});
</script>

</body>
</html>
